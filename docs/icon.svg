<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Flightdeck icon: a gauge dial over three HUD bars">
  <!-- Flightdeck's icon: a flight-instrument gauge over three HUD bars, in the
       panel's colours. Render to .claude-plugin/icon.png at 1024 x 1024. -->
  <rect width="1024" height="1024" rx="200" fill="#000000"/>
  <rect x="24" y="24" width="976" height="976" rx="180" fill="none" stroke="#696b67" stroke-width="12"/>
  <g fill="none" stroke-linecap="round">
    <!-- the dial: a 240-degree track, filled to about two thirds -->
    <path d="M 293 590 A 250 250 0 1 1 731 590" stroke="#2e2e2e" stroke-width="56"/>
    <path d="M 293 590 A 250 250 0 0 1 512 220 A 250 250 0 0 1 696 300" stroke="#d78787" stroke-width="56"/>
  </g>
  <!-- ticks -->
  <g stroke="#949494" stroke-width="10" stroke-linecap="round">
    <line x1="512" y1="300" x2="512" y2="335"/>
    <line x1="362" y1="362" x2="387" y2="387"/>
    <line x1="662" y1="362" x2="637" y2="387"/>
    <line x1="300" y1="512" x2="335" y2="512"/>
    <line x1="724" y1="512" x2="689" y2="512"/>
  </g>
  <!-- needle and hub -->
  <line x1="512" y1="470" x2="640" y2="345" stroke="#d3d7cf" stroke-width="22" stroke-linecap="round"/>
  <circle cx="512" cy="470" r="42" fill="#d78787"/>
  <circle cx="512" cy="470" r="16" fill="#000000"/>
  <!-- HUD bars -->
  <g stroke-linecap="round" stroke-width="40">
    <line x1="262" y1="690" x2="762" y2="690" stroke="#2e2e2e"/>
    <line x1="262" y1="690" x2="612" y2="690" stroke="#afd7ff"/>
    <line x1="262" y1="770" x2="762" y2="770" stroke="#2e2e2e"/>
    <line x1="262" y1="770" x2="462" y2="770" stroke="#87d787"/>
    <line x1="262" y1="850" x2="762" y2="850" stroke="#2e2e2e"/>
    <line x1="262" y1="850" x2="702" y2="850" stroke="#ff87af"/>
  </g>
</svg>
